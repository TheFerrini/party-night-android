name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: party-night-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Party Night APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Install Party Night launcher icons
        run: sh ./scripts/install-android-icons.sh

      - name: Set Android versionCode and versionName
        shell: bash
        run: |
          VERSION="$(node -e 'const s=require("fs").readFileSync("src/version.ts","utf8"); const m=s.match(/APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]/); if (!m) process.exit(1); console.log(m[1]);')"
          CODE="$(node -e '
            const match = process.argv[1].match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) { console.error("APP_VERSION must be numeric (for example 2.0.6): " + process.argv[1]); process.exit(1); }
            const [major, minor, patch] = match.slice(1).map(Number);
            const code = major * 1000000 + minor * 10000 + patch * 10;
            if (!Number.isSafeInteger(code) || code <= 0 || code > 2100000000) { console.error("Invalid Android versionCode: " + code); process.exit(1); }
            console.log(code);
          ' "$VERSION")"
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" android/app/build.gradle

      - name: Restore stable Android debug signing key
        id: debug-signing-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: party-night-android-debug-keystore-v2

      - name: Generate Android debug signing key on first build
        if: steps.debug-signing-key.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Save stable Android debug signing key
        if: steps.debug-signing-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: party-night-android-debug-keystore-v2

      - name: Configure explicit stable Android debug signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          content = path.read_text()
          if "partyNightStableDebug" not in content:
              signing = """
          android {
              signingConfigs {
                  partyNightStableDebug {
                      storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.partyNightStableDebug
                  }
              }
          }
          """
              path.write_text(content.rstrip() + "\n\n" + signing + "\n")
          PY
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with app name and version
        id: rename-apk
        shell: bash
        run: |
          VERSION="$(node -e 'const s=require("fs").readFileSync("src/version.ts","utf8"); const m=s.match(/APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]/); if (!m) process.exit(1); console.log(m[1]);')"
          SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="android/app/build/outputs/apk/debug/Party Night-v${VERSION}.apk"
          test -f "$SOURCE"
          mv "$SOURCE" "$DEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "filename=Party Night-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature matches persistent key
        shell: bash
        run: |
          APK="${{ steps.rename-apk.outputs.path }}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_SHA="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$KEY_SHA"
          test -n "$APK_SHA"
          test "$KEY_SHA" = "$APK_SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Party-Night-v${{ steps.rename-apk.outputs.version }}-APK
          path: ${{ steps.rename-apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(node -e 'const s=require("fs").readFileSync("src/version.ts","utf8"); const m=s.match(/APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]/); if (!m) process.exit(1); console.log(m[1]);')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.app-version.outputs.version }}"
          APK="${{ steps.rename-apk.outputs.path }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Party Night $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" \
              --title "Party Night $TAG" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
