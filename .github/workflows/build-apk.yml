name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: party-night-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Party Night APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Set Android versionCode and versionName
        shell: bash
        run: |
          VERSION="$(node -e 'const s=require("fs").readFileSync("src/version.ts","utf8"); const m=s.match(/APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]/); if (!m) process.exit(1); console.log(m[1]);')"
          BASE_VERSION="${VERSION%b}"
          SUFFIX=""
          if [[ "${VERSION}" == *b ]]; then SUFFIX="b"; fi
          CODE="$(node -e 'const [a,b,c] = process.argv[1].split(".").map(Number); console.log(a * 1000000 + b * 10000 + c * 10 + (process.argv[2] === "b" ? 1 : 0))' "$BASE_VERSION" "$SUFFIX")"
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" android/app/build.gradle

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: party-night-android-debug-keystore-v1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: party-night-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(node -e 'const s=require("fs").readFileSync("src/version.ts","utf8"); const m=s.match(/APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]/); if (!m) process.exit(1); console.log(m[1]);')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.app-version.outputs.version }}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Party Night $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" \
              --title "Party Night $TAG" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA" \
              --latest
          fi